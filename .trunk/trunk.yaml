---
# Trunk beží vo WSL2 a pokrýva ne-PHP súbory. PHP kvalitu riešia PHAR nástroje
# cez tools/quality.ps1. Projektové Git hooky spravuje core.hooksPath=hooks;
# nezapínaj Trunk actions s git_hooks triggerom, pretože by túto cestu prepísali.
version: 0.1

cli:
  version: 1.25.0

plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins

lint:
  definitions:
    - name: gitleaks
      environment:
        - name: GITLEAKS_CONFIG
          value: ${workspace}/.gitleaks.toml

  enabled:
    - gitleaks@8.30.1
    - markdownlint@0.49.0
    - prettier@3.8.4
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - taplo@0.10.0
    - yamllint@1.38.0

  # Explicitné disabled položky bránia ich opätovnému ponúkaniu pri upgrade.
  disabled:
    - black # Pyproject je historický; repo neobsahuje Python zdrojové súbory.
    - checkov # Repo neobsahuje Terraform, Docker ani inú IaC konfiguráciu.
    - eslint # Bez eslint.config by kontrola existujúceho JS vytvárala šum.
    - git-diff-check # Vo WSL hlási CRLF ako whitespace; hook používa git diff --check.
    - oxipng # Binárne assety sa nesmú automaticky prepisovať.
    - php-cs-fixer # PHP rieši tools/quality.ps1 natívne na Windows.
    - phpstan # PHP rieši tools/quality.ps1 natívne na Windows.
    - stylelint # Ručne udržiavaný index.css zatiaľ nemá baseline.
    - svgo # Binárne assety sa nesmú automaticky prepisovať.
    - trufflehog # Gitleaks už pokrýva detekciu tajomstiev.

  ignore:
    # Vendored, binárne, privátne a generované súbory.
    - linters: [ALL]
      paths:
        - .kilo/** # Workspace VS Code rozšírenia (Kilo) — nie projektový zdroj.
        - assets/**
        - extraction_results.json
        - extracted_*.txt
        - img/**
        - node_modules/**
        - pages_*.txt
        - pdf/**
        - private/**
        - scratch/**
        - tools/*.phar
        - tools/.watermark-manifest.json # Generované (json_encode); nie ručne udržiavané.
        - uploads/**
        - vendor/**
        - "**/*.min.css"
        - "**/*.min.js"

    # Historické/publikačné návody majú zámerné Markdown rozloženie —
    # ani markdownlint, ani prettier ich nesmú meniť.
    - linters: [markdownlint, prettier]
      paths:
        - .audit.md
        - PUBLIKOVANIE_*.md

    # Konzervatívne formátovanie: Prettier nemení ručný aplikačný CSS/JS.
    - linters: [prettier]
      paths:
        - "**/*.css"
        - "**/*.js"
        - "**/*.mjs"

# Piny zabezpečujú rovnaké nástroje lokálne aj v prípadnom CI.
runtimes:
  enabled:
    - go@1.25.0
    - node@22.16.0
    - python@3.14.4
