---
name: Trunk Check

# Continuous quality cez Trunk. Beží na Linux runneri (žiadny WSL problém ako
# lokálne na Windows). Lokálne git hooky (core.hooksPath=hooks) tým nerušíme —
# Trunk zámerne nie je v git hookoch, kontroluje sa tu na strane GitHubu.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # Trunk posiela inline anotácie k nálezom.

jobs:
  trunk-check:
    name: Trunk Check Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # These binary directories are already excluded by .trunk/trunk.yaml.
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/pdf/
            !/img/
            !/uploads/

      - name: Trunk Check
        uses: trunk-io/trunk-action@v1
