---
name: Deploy to nefro.polascin.net

# Nasadenie cez rsync/SSH podľa vzoru polascin.net. Deploy job sa preskočí
# s upozornením, kým nie sú nastavené DEPLOY_* secrets (Settings → Secrets
# and variables → Actions), takže workflow nezostáva červený pred konfiguráciou.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nefro-production-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate deployable sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Lint PHP syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(git ls-files -z -- '*.php')
          echo "All tracked PHP files passed php -l."

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip deploy]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check deploy configuration
        id: cfg
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" || -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_KNOWN_HOSTS" || -z "$DEPLOY_REMOTE_PATH" ]]; then
            echo "::notice::Deploy skipped — configure DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS and DEPLOY_REMOTE_PATH secrets (see DEPLOY.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::DEPLOY_USER contains unsupported characters."; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::DEPLOY_HOST contains unsupported characters."; exit 1; }
          REMOTE_PATH="${DEPLOY_REMOTE_PATH%/}"
          if [[ -z "$REMOTE_PATH" || "$REMOTE_PATH" != /* || "$REMOTE_PATH" =~ ^/+$ || "$REMOTE_PATH" == *".."* || "$REMOTE_PATH" == *"//"* ]]; then
            echo "::error::DEPLOY_REMOTE_PATH must be a safe absolute non-root path."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "remote_path=$REMOTE_PATH" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        if: steps.cfg.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify remote directory exists
        if: steps.cfg.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          REMOTE_PATH: ${{ steps.cfg.outputs.remote_path }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -d '$REMOTE_PATH'" \
            || { echo "::error::Remote directory $REMOTE_PATH does not exist — create it first."; exit 1; }

      - name: Rsync repository to web root
        if: steps.cfg.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          REMOTE_PATH: ${{ steps.cfg.outputs.remote_path }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          # Bez --delete: serverové súbory mimo repozitára (konfigurácia,
          # nahraný obsah) zostávajú nedotknuté.
          rsync -rlptz --itemize-changes \
            --chmod=D755,F644 \
            --exclude-from=.deployignore \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o BatchMode=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_PATH/"

      # UPSERT zmenených článkov: rsync nahrá add_*_article.php, ale obsah v DB
      # sa zmení až jeho spustením na serveri. Zámerne len --diff-filter=M
      # (upravené), nie A (nové) — pri prvom vložení šablóna rozosiela newsletter
      # avízo, a to nesmie spustiť CI bez dozoru. Nové články publikuj ručne.
      - name: Upsert changed articles
        if: steps.cfg.outputs.configured == 'true' && github.event_name == 'push'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          REMOTE_PATH: ${{ steps.cfg.outputs.remote_path }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          SSH="ssh -i $HOME/.ssh/deploy_key -p $PORT -o BatchMode=yes $DEPLOY_USER@$DEPLOY_HOST"
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "::notice::Predchádzajúci commit nie je dostupný — upsert preskočený."
            exit 0
          fi
          mapfile -t FILES < <(git diff --name-only --diff-filter=M "$BEFORE_SHA" "$AFTER_SHA" -- 'add_*_article.php' || true)
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "Žiadny upravený článok — upsert netreba."
            exit 0
          fi
          for f in "${FILES[@]}"; do
            echo "::group::UPSERT $f"
            $SSH "php '$REMOTE_PATH/$f'"
            echo "::endgroup::"
          done
          echo "::group::Regenerácia neaktuálnych PDF"
          $SSH "php '$REMOTE_PATH/generate_all_article_pdfs.php' --stale"
          echo "::endgroup::"

      - name: Smoke test
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          for url in "https://nefro.polascin.net/" "https://nefro.polascin.net/privacy.php" "https://nefro.polascin.net/terms.php"; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> $code"
            [[ "$code" == "200" ]] || { echo "::error::Smoke test failed for $url (HTTP $code)."; exit 1; }
          done
