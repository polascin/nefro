---
name: Regressions
on:
  workflow_call:
permissions:
  contents: read
jobs:
  regressions:
    name: Regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Isolated MariaDB and HTTP integration suite
        shell: bash
        run: bash tools/integration/run.sh
