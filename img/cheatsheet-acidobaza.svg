<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d" font-family="'Inter','Segoe UI',Arial,sans-serif">
  <title id="t">Acidobáza — pH škála</title>
  <desc id="d">Schéma acidobázy: pH škála od acidémie po alkalémiu s normou 7,35–7,45 a príspevkom respiračnej (pCO₂) a metabolickej (HCO₃⁻) zložky.</desc>
  <defs>
    <linearGradient id="ph" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="0.42" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#16a34a"/>
      <stop offset="0.58" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="120" fill="#1e3a8a"/>
  <text x="60" y="62" fill="#ffffff" font-size="46" font-weight="700">Acidobáza</text>
  <text x="60" y="98" fill="#bfdbfe" font-size="26" font-weight="500">Systematická interpretácia — pH → porucha → kompenzácia</text>

  <!-- pH škála -->
  <rect x="120" y="270" width="960" height="64" rx="32" fill="url(#ph)"/>
  <!-- norma -->
  <rect x="552" y="258" width="96" height="88" rx="10" fill="none" stroke="#16a34a" stroke-width="4"/>
  <text x="600" y="392" fill="#16a34a" font-size="30" font-weight="700" text-anchor="middle">7,40</text>
  <text x="600" y="420" fill="#475569" font-size="20" text-anchor="middle">norma 7,35–7,45</text>

  <!-- ticky -->
  <g fill="#334155" font-size="22" text-anchor="middle">
    <text x="120" y="250">6,8</text>
    <text x="360" y="250">7,1</text>
    <text x="840" y="250">7,6</text>
    <text x="1080" y="250">7,8</text>
  </g>

  <text x="120" y="200" fill="#b91c1c" font-size="30" font-weight="700">ACIDÉMIA ↓pH</text>
  <text x="1080" y="200" fill="#1d4ed8" font-size="30" font-weight="700" text-anchor="end">ALKALÉMIA ↑pH</text>

  <!-- prispievatele -->
  <g font-size="26">
    <circle cx="330" cy="510" r="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="330" y="519" text-anchor="middle" font-size="26" font-weight="700" fill="#0284c7">P</text>
    <text x="386" y="500" fill="#0f172a" font-weight="700">Respiračná zložka</text>
    <text x="386" y="532" fill="#475569" font-size="24">pCO₂ — riadia pľúca (35–45 mmHg)</text>

    <circle cx="330" cy="580" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="330" y="589" text-anchor="middle" font-size="26" font-weight="700" fill="#16a34a">M</text>
    <text x="386" y="570" fill="#0f172a" font-weight="700">Metabolická zložka</text>
    <text x="386" y="602" fill="#475569" font-size="24">HCO₃⁻ — riadia obličky (22–26 mmol/l)</text>
  </g>
</svg>
