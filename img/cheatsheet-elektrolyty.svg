<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d" font-family="'Inter','Segoe UI',Arial,sans-serif">
  <title id="t">Elektrolyty — referenčné hodnoty</title>
  <desc id="d">Päť dlaždíc elektrolytov so sérovými referenčnými rozsahmi: sodík, draslík, vápnik, magnézium a fosfát.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="120" fill="#0f766e"/>
  <text x="60" y="62" fill="#ffffff" font-size="46" font-weight="700">Elektrolyty</text>
  <text x="60" y="98" fill="#99f6e4" font-size="26" font-weight="500">Sérové referenčné hodnoty a poruchy</text>

  <g font-family="'Inter','Segoe UI',Arial,sans-serif">
    <!-- Na -->
    <g>
      <rect x="50" y="200" width="210" height="330" rx="18" fill="#ffffff" stroke="#0ea5e9" stroke-width="4"/>
      <text x="155" y="320" text-anchor="middle" font-size="76" font-weight="800" fill="#0ea5e9">Na⁺</text>
      <text x="155" y="372" text-anchor="middle" font-size="28" font-weight="600" fill="#0f172a">Sodík</text>
      <text x="155" y="470" text-anchor="middle" font-size="30" font-weight="700" fill="#334155">135–145</text>
      <text x="155" y="502" text-anchor="middle" font-size="22" fill="#64748b">mmol/l</text>
    </g>
    <!-- K -->
    <g>
      <rect x="280" y="200" width="210" height="330" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
      <text x="385" y="320" text-anchor="middle" font-size="76" font-weight="800" fill="#7c3aed">K⁺</text>
      <text x="385" y="372" text-anchor="middle" font-size="28" font-weight="600" fill="#0f172a">Draslík</text>
      <text x="385" y="470" text-anchor="middle" font-size="30" font-weight="700" fill="#334155">3,5–5,0</text>
      <text x="385" y="502" text-anchor="middle" font-size="22" fill="#64748b">mmol/l</text>
    </g>
    <!-- Ca -->
    <g>
      <rect x="510" y="200" width="210" height="330" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
      <text x="615" y="320" text-anchor="middle" font-size="70" font-weight="800" fill="#16a34a">Ca²⁺</text>
      <text x="615" y="372" text-anchor="middle" font-size="28" font-weight="600" fill="#0f172a">Vápnik</text>
      <text x="615" y="470" text-anchor="middle" font-size="30" font-weight="700" fill="#334155">2,15–2,55</text>
      <text x="615" y="502" text-anchor="middle" font-size="22" fill="#64748b">mmol/l</text>
    </g>
    <!-- Mg -->
    <g>
      <rect x="740" y="200" width="210" height="330" rx="18" fill="#ffffff" stroke="#d97706" stroke-width="4"/>
      <text x="845" y="320" text-anchor="middle" font-size="66" font-weight="800" fill="#d97706">Mg²⁺</text>
      <text x="845" y="372" text-anchor="middle" font-size="28" font-weight="600" fill="#0f172a">Magnézium</text>
      <text x="845" y="470" text-anchor="middle" font-size="30" font-weight="700" fill="#334155">0,70–1,00</text>
      <text x="845" y="502" text-anchor="middle" font-size="22" fill="#64748b">mmol/l</text>
    </g>
    <!-- PO4 -->
    <g>
      <rect x="970" y="200" width="210" height="330" rx="18" fill="#ffffff" stroke="#db2777" stroke-width="4"/>
      <text x="1075" y="320" text-anchor="middle" font-size="64" font-weight="800" fill="#db2777">PO₄</text>
      <text x="1075" y="372" text-anchor="middle" font-size="28" font-weight="600" fill="#0f172a">Fosfát</text>
      <text x="1075" y="470" text-anchor="middle" font-size="30" font-weight="700" fill="#334155">0,80–1,45</text>
      <text x="1075" y="502" text-anchor="middle" font-size="22" fill="#64748b">mmol/l</text>
    </g>
  </g>
  <text x="600" y="588" text-anchor="middle" font-size="24" fill="#475569">Magnézium koriguj ako prvé — refraktérna hypokaliémia aj hypokalciémia</text>
</svg>
