<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    
    <!-- Kidney Gradient -->
    <linearGradient id="kidneyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    
    <!-- Glow effect for kidneys -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Avatar Background -->
  <rect width="200" height="200" rx="100" fill="url(#bgGradient)"/>
  
  <!-- Badge Text / Heading -->
  <text x="100" y="26" font-family="'Inter', sans-serif" font-weight="500" font-size="7" fill="rgba(255,255,255,0.6)" text-anchor="middle">Používateľ webovej lokality</text>
  <text x="100" y="38" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">
    <tspan fill="rgba(56, 189, 248, 0.5)" font-weight="400">https://</tspan><tspan fill="#ffffff" font-weight="800">nefro.polascin.net</tspan><tspan fill="rgba(56, 189, 248, 0.5)" font-weight="400">/</tspan>
  </text>
  
  <!-- Outer glowing rings (Modern aesthetic) -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(56, 189, 248, 0.1)" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Shift the entire character down to leave space for the heading -->
  <g transform="translate(0, 0)">

  <!-- Abstract Unisex Body (Glassmorphism style) -->
  <g fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2">
    <!-- Head -->
    <circle cx="100" cy="66" r="22"/>
    <!-- Torso -->
    <path d="M100 95c-25 0-45 18-50 40v40h100v-40c-5-22-25-40-50-40z"/>
  </g>

  <!-- Brain Schematic -->
  <g stroke="rgba(56, 189, 248, 0.8)" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" transform="translate(100, 66) scale(0.7) translate(-100, -60)">
    <!-- Left Hemisphere -->
    <path d="M 98,45 C 82,45 78,55 80,62 C 82,68 78,72 84,75 C 90,78 96,75 98,70 Z" />
    <path d="M 94,49 Q 88,52 92,56" />
    <path d="M 96,55 Q 86,60 92,64" />
    <path d="M 96,62 Q 90,66 94,70" />
    
    <!-- Right Hemisphere -->
    <path d="M 102,45 C 118,45 122,55 120,62 C 118,68 122,72 116,75 C 110,78 104,75 102,70 Z" />
    <path d="M 106,49 Q 112,52 108,56" />
    <path d="M 104,55 Q 114,60 108,64" />
    <path d="M 104,62 Q 110,66 106,70" />
    
    <!-- Central connections -->
    <line x1="98" y1="52" x2="102" y2="52" stroke-width="0.8" stroke="rgba(56, 189, 248, 0.5)"/>
    <line x1="98" y1="60" x2="102" y2="60" stroke-width="0.8" stroke="rgba(56, 189, 248, 0.5)"/>
    <line x1="98" y1="68" x2="102" y2="68" stroke-width="0.8" stroke="rgba(56, 189, 248, 0.5)"/>
  </g>

  <!-- Kidneys -->
  <!-- Left Kidney (Realistic bean shape) -->
  <path d="M 0,-14 C -12,-14 -12,14 0,14 C 8,14 2,5 2,0 C 2,-5 8,-14 0,-14 Z" 
        fill="url(#kidneyGradient)" filter="url(#glow)" 
        transform="translate(78, 112) rotate(15) scale(1.1)"/>
        
  <!-- Right Kidney (Realistic bean shape, flipped) -->
  <path d="M 0,-14 C -12,-14 -12,14 0,14 C 8,14 2,5 2,0 C 2,-5 8,-14 0,-14 Z" 
        fill="url(#kidneyGradient)" filter="url(#glow)" 
        transform="translate(122, 112) scale(-1, 1) rotate(15) scale(1.1)"/>

  <!-- Hemodialysis Concept (Left side) -->
  <!-- Red/Blue Arterial & Venous lines (Circuit) -->
  <path d="M 80,115 Q 60,105 45,120 T 60,140" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <path d="M 80,115 Q 50,90 35,115 T 60,150" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Dialyzer Filter (Cylinder) -->
  <rect x="35" y="110" width="8" height="22" rx="3" fill="rgba(255,255,255,0.9)" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="35" y1="115" x2="43" y2="115" stroke="#94a3b8" stroke-width="1"/>
  <line x1="35" y1="120" x2="43" y2="120" stroke="#94a3b8" stroke-width="1"/>
  <line x1="35" y1="125" x2="43" y2="125" stroke="#94a3b8" stroke-width="1"/>

  <!-- Peritoneal Dialysis Concept (Right side & Abdomen) -->
  <!-- Peritoneal Cavity / Fluid -->
  <ellipse cx="100" cy="140" rx="20" ry="15" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,2"/>
  <!-- Catheter Tube to Kidney area / External bag concept -->
  <path d="M 120,115 Q 140,130 115,140" fill="none" stroke="#fde047" stroke-width="2"/>
  <!-- Fluid exchange arrows / drop (In & Out) -->
  <path d="M 97,135 L 103,135 L 100,142 Z" fill="#38bdf8"/>
  <path d="M 97,145 L 103,145 L 100,138 Z" fill="#fde047"/>

  <!-- Modern Tech / Medical UI accents (Focus reticle on the body) -->
  <circle cx="100" cy="100" r="2" fill="#38bdf8"/>
  <line x1="100" y1="90" x2="100" y2="96" stroke="#38bdf8" stroke-width="1"/>
  <line x1="100" y1="104" x2="100" y2="110" stroke="#38bdf8" stroke-width="1"/>
  <line x1="90" y1="100" x2="96" y2="100" stroke="#38bdf8" stroke-width="1"/>
  <line x1="104" y1="100" x2="110" y2="100" stroke="#38bdf8" stroke-width="1"/>

  </g>
</svg>
