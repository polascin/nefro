; Produkčné nastavenie PHP pre web root (PHP-FPM/FastCGI číta .user.ini per adresár).
; Chyby sa výhradne logujú, nikdy nezobrazujú návštevníkovi.
;
; Dôvod (Beh 98): fatal error vypisoval do odpovede absolútnu cestu
; /data/8/6/<uuid>/polascin.net/sub/nefro/... aj so stack trace — na troch
; právnych stránkach (2026-07-23 až 2026-08-25) a na štyroch include-only
; partialoch. Samotné `ini_set()` v `auth.php` to nepokrýva, lebo fatal
; nastane skôr, než sa `auth.php` vôbec načíta (presne to bol prípad
; `privacy.php`, kde sa `auth.php` vťahoval až cez `legal_head.php`).
;
; Prístup k tomuto súboru cez HTTP blokuje `<Files "*.ini">` v .htaccess.
display_errors = Off
display_startup_errors = Off
log_errors = On
